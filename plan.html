<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your family plan · FactFind360</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="shield.svg">
<style>
  :root{--navy:#081221;--navy2:#0F1E36;--teal:#14B8A6;--teal2:#2DD4BF;--gold:#F5B324;--ink:#0F172A;--mute:#94A3B8}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(800px 500px at 15% 0%,rgba(20,184,166,.18),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(245,179,36,.12),transparent 60%),var(--navy);color:#fff;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
  header{display:flex;align-items:center;gap:10px;padding:14px 18px}header img{width:24px;height:29px}header b{font-weight:800}
  header .tag{margin-left:auto;background:var(--gold);color:#1F2937;font-weight:800;font-size:11px;letter-spacing:.12em;padding:4px 10px;border-radius:999px}
  main{max-width:860px;margin:0 auto;padding:4px 16px 150px;min-height:70vh;position:relative}
  .sc{display:none;animation:in .5s ease both}.sc.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  h1{font-size:clamp(1.9rem,6vw,3rem);line-height:1.08;font-weight:900;letter-spacing:-.01em;margin:18px 0 8px}h1 em{font-style:normal;color:var(--teal2)}
  .sub{color:#CBD5E1;font-size:1.05rem}
  .kick{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--teal2);margin-top:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:12px;margin-top:14px}
  .card{background:var(--navy2);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 18px;opacity:0;transform:translateY(12px);transition:opacity .45s,transform .45s}
  .card.show{opacity:1;transform:none}.card.ins{border-color:rgba(245,179,36,.5)}.card.ins b{font-size:1.05rem;font-weight:700}.card small{display:block;font-size:11.5px;letter-spacing:.12em;font-weight:800;color:var(--mute)}.card b{font-size:1.25rem}
  .big{font-size:clamp(1.4rem,3.8vw,2rem);font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{height:14px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:10px;display:flex}.bar i{display:block;height:100%;transition:width 1.4s ease}
  .rec{background:#fff;color:var(--ink);border-radius:16px;padding:16px 18px;border-left:6px solid var(--teal);opacity:0;transform:translateX(20px);transition:opacity .45s,transform .45s}
  .rec.show{opacity:1;transform:none}.rec h3{font-size:1.25rem;font-weight:900}.rec .m{color:#0F766E;font-weight:700;font-size:.95rem}.rec .y{color:#334155;font-style:italic;margin-top:6px;font-size:.95rem}
  .btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
  .btn{font:inherit;font-weight:800;font-size:1.05rem;border:0;border-radius:14px;padding:16px 22px;min-height:52px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .btn.go{background:var(--gold);color:#1F2937}.btn.alt{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
  .start{position:fixed;inset:0;z-index:5;background:rgba(8,18,33,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .start .play{width:110px;height:110px;border-radius:50%;border:0;background:var(--teal);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}100%{box-shadow:0 0 0 26px rgba(45,212,191,0)}}
  .start h2{font-size:clamp(1.5rem,5vw,2.2rem);font-weight:900;margin:22px 0 6px}.start p{color:#CBD5E1;max-width:30rem}
  .safe{margin-top:14px;font-size:.92rem;color:#FDE68A}
  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(8,18,33,.95);border-top:1px solid rgba(255,255,255,.1);padding:10px 16px 14px}
  .cap{max-width:860px;margin:0 auto;font-size:1.02rem;font-weight:600;min-height:2.8em}.cap span{color:var(--teal2);font-weight:800;font-size:.78rem;letter-spacing:.12em;margin-right:8px}
  .ctl{max-width:860px;margin:8px auto 0;display:flex;align-items:center;gap:10px}
  .ctl button{font:inherit;font-weight:700;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:8px 14px;min-height:44px;cursor:pointer}
  .dots{display:flex;gap:6px;margin-left:auto}.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}.dots i.on{background:var(--teal2)}
  .note{font-size:.8rem;color:var(--mute);margin-top:22px}
  .err{max-width:560px;margin:80px auto;text-align:center;color:#CBD5E1}
  @media (prefers-reduced-motion:reduce){.sc,.card,.rec,.bar i{animation:none;transition:none}.start .play{animation:none}}
</style>
</head>
<body>
<header><img src="shield.svg" alt=""><b>FactFind360</b><span class="tag" id="tag">YOUR FAMILY PLAN</span></header>
<main id="main"></main>
<div class="dock" id="dock" hidden><div class="cap" id="cap"></div><div class="ctl"><button type="button" id="pp">Pause</button><button type="button" id="rp">Start again</button><div class="dots" id="dots"></div></div></div>
<script>
/* The client's narrated plan (3 November 2026, practice copy).
   Practice: the plan's facts travel in the address after #, which never
   reaches any server. The live version opens from a private, expiring link
   that asks for the client's date of birth first, and reads the facts from
   the fact find on the server. */
window.RRB_GUEST = true;
var CURRENT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbx776ORwmwhm2u4vx2YGQPC6bRR9gTQ-Y-Yc1up0FNGkCKGaQdet-APT1PJsrAxxJ3dsQ/exec';
</script>
<script src="andrew.js"></script>
<script>
(function () {
  'use strict';
  var D = null;
  try { var b = (location.hash.match(/p=([^&]+)/) || [])[1]; if (b) D = JSON.parse(decodeURIComponent(escape(atob(b.replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) {}
  var M = document.getElementById('main');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  if (!D) { M.innerHTML = '<div class="err"><h1>This plan link is incomplete.</h1><p>Please open it again from the e-mail your advisor sent.</p></div>'; return; }
  function tt(n) { return 'TT$' + Math.round(n).toLocaleString('en-US'); }
  function say$(n) { return Math.round(n).toLocaleString('en-US') + ' dollars'; }
  function who(w) { if (/spouse/i.test(w) && D.spouseFirst) return D.spouseFirst; if (/client/i.test(w) || !w) return D.first || 'you'; return w; }
  var names = D.spouseFirst ? D.first + ' and ' + D.spouseFirst : D.first;
  /* WhatsApp to the branch, first line written for them (9 November 2026). */
  var waText = 'Hi Ricky Rampersad Branch, this is ' + (D.first || 'a client') + '. I watched the family plan ' + (D.advisorFirst || 'my advisor') + ' prepared for us and would like to talk.';
  window.RRB_WA_TEXT = waText;

  /* Scenes: [html, lines]; a line can reveal an element (#id) as it is said. */
  var SC = [];
  var br = D.branch || 'Ricky Rampersad Branch';
  document.getElementById('tag').textContent = 'PRESENTED BY ' + String(D.advisor).toUpperCase();
  SC.push(['<div class="kick">PRESENTED BY YOUR ADVISOR</div><h1>The <em>' + esc(D.surname || D.first) + '</em> household</h1><p class="sub">A plan for ' + esc(names) + ', from ' + esc(D.advisor) + ' &middot; ' + esc(br) + ', Guardian Life of the Caribbean.</p>',
    [['Hello ' + names + '. This is your family plan, prepared for you by ' + D.advisor + ', from the ' + br + ' of Guardian Life.'], ['It takes about three minutes. Watch it together, and if you are driving, just listen.']]]);
  if (!D.advice) {
    var cards = [], lines = [['Here is what you told us.']];
    if (D.spouse) { cards.push(['c1', 'FAMILY', esc(D.spouse)]); lines.push(['You are married to ' + D.spouseFirst + '.', '#c1']); }
    if (D.kids && D.kids.length) { cards.push(['c2', 'CHILDREN', D.kids.map(function (k) { return esc(k.name) + (k.age !== '' ? ', ' + k.age : ''); }).join(' · ')]);
      lines.push(['You have ' + D.kids.length + (D.kids.length === 1 ? ' child, ' : ' children, ') + D.kids.map(function (k) { return k.name + (k.age !== '' ? ', ' + k.age : ''); }).join(', and ') + '.', '#c2']); }
    if (D.income) { cards.push(['c3', 'INCOME A MONTH', esc(D.first) + ' ' + tt(D.income) + (D.spouseIncome ? ' · ' + esc(D.spouseFirst || 'spouse') + ' ' + tt(D.spouseIncome) : '')]);
      lines.push([D.first + ' earns ' + say$(D.income) + ' a month' + (D.spouseIncome ? ', and ' + (D.spouseFirst || 'your spouse') + ' ' + say$(D.spouseIncome) : '') + '.', '#c3']); }
    if (D.mortgage) { cards.push(['c4', 'STILL OWED ON YOUR HOME', tt(D.mortgage)]); lines.push(['There is ' + say$(D.mortgage) + ' still owed on your home.', '#c4']); }
    if (D.goals && D.goals.length) { cards.push(['c5', 'WHAT MATTERS MOST', D.goals.map(function (g) { return esc(g.desc || g.need); }).join(' · ')]);
      lines.push(['And what matters most to you: ' + D.goals.map(function (g) { return g.desc || g.need; }).join(', and ') + '.', '#c5']); }
    SC.push(['<div class="kick">WHAT YOU TOLD US</div><h1>Your family, <em>in your words.</em></h1><div class="grid">' + cards.map(function (c) { return '<div class="card" id="' + c[0] + '"><small>' + c[1] + '</small><b>' + c[2] + '</b></div>'; }).join('') + '</div>', lines]);
    if (D.insights && D.insights.length) {
      var il = [['Here is what we noticed.']];
      var ih = D.insights.map(function (x, i) { il.push([x.say, '#i' + i]); return '<div class="card ins" id="i' + i + '"><small>' + esc(x.title).toUpperCase() + '</small><b>' + esc(x.text) + '</b></div>'; }).join('');
      SC.push(['<div class="kick" style="color:var(--gold)">WHAT WE NOTICED</div><h1>The things that <em>matter most.</em></h1><div class="grid">' + ih + '</div>', il]);
    }
    if (D.totalNeed || D.gap) {
      SC.push(['<div class="kick">WHAT YOUR FAMILY WOULD NEED</div><h1>If the unexpected <em>happened.</em></h1><div class="grid">' +
        (D.totalNeed ? '<div class="card" id="n1"><small>YOUR FAMILY WOULD NEED</small><div class="big" style="color:#fff">' + esc(D.totalNeed) + '</div></div>' : '') +
        (D.cover ? '<div class="card" id="n2"><small>YOU HAVE TODAY</small><div class="big" style="color:#fff">' + esc(D.cover) + '</div></div>' : '') +
        (D.gap ? '<div class="card" id="n3" style="border-color:var(--gold)"><small>THE GAP</small><div class="big">' + esc(D.gap) + '</div></div>' : '') + '</div>',
        [['If the unexpected happened, here is what your family would need.'],
         D.totalNeed ? ['In all, about ' + D.totalNeed.replace(/TT\$\s*/, '') + ' dollars.', '#n1'] : null,
         D.cover ? ['You have ' + D.cover.replace(/TT\$\s*/, '') + ' dollars of cover today.', '#n2'] : null,
         D.gap ? ['That leaves a gap of ' + D.gap.replace(/TT\$\s*/, '') + ' dollars. That is what ' + D.advisorFirst + "'s recommendation is here to close.", '#n3'] : null].filter(Boolean)]);
    }
  }
  if (D.recs && D.recs.length) {
    var rl = [['Here is what ' + D.advisorFirst + ' recommends' + (D.advice && D.need ? ' for ' + D.need : '') + '.']];
    var rh = D.recs.map(function (r, i) {
      rl.push([r.plan + ', for ' + who(r.who) + (r.amt ? ': ' + say$(r.amt) + ' of cover' : '') + '.', '#r' + i]);
      if (r.reason) rl.push(['Why? ' + r.reason]);
      return '<div class="rec" id="r' + i + '"><h3>' + esc(r.plan) + '</h3><div class="m">For ' + esc(who(r.who)) + (r.amt ? ' · ' + tt(r.amt) + ' cover' : '') + '</div>' + (r.reason ? '<div class="y">Why: ' + esc(r.reason) + '</div>' : '') + '</div>';
    }).join('');
    SC.push(['<div class="kick">WHAT ' + esc(D.advisorFirst).toUpperCase() + ' RECOMMENDS</div><h1>Your plan, <em>in plain words.</em></h1><div class="grid" style="grid-template-columns:1fr">' + rh + '</div>', rl]);
  }
  SC.push(['<div class="kick">NEXT</div><h1>If this looks right, <em>confirm it.</em></h1><p class="sub">One tap, and ' + esc(D.advisorFirst) + ' takes it from here.</p><div class="btns"><a class="btn go" href="#" onclick="alert(\'Practice copy: in the real e-mail this confirms your fact find.\');return false">Confirm my fact find</a>' +
    (D.advisorEmail ? '<a class="btn alt" href="mailto:' + esc(D.advisorEmail) + '">Ask ' + esc(D.advisorFirst) + ' a question</a>' : '') +
    '<a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/18686785921?text=' + encodeURIComponent(waText) + '">WhatsApp the branch</a>' +
    '<a class="btn alt" href="tel:+18686785921">Call the branch</a></div>' +
    '<p class="note">This plan is based on what you told your advisor and is not a contract. Cover starts only when a policy is issued. Practice copy with a made-up client.</p>',
    [['If this looks right, tap Confirm, and ' + D.advisorFirst + ' takes it from here.'], ['If you have questions first, just ask. Thank you for trusting the ' + br + ' with your family\'s future.']]]);

  var dots = document.getElementById('dots');
  dots.innerHTML = SC.map(function () { return '<i></i>'; }).join('');
  M.innerHTML = SC.map(function (s, i) { return '<section class="sc" id="s' + i + '">' + s[0] + '</section>'; }).join('');
  var P = { i: -1, on: false, paused: false, tok: 0 };
  function show(i) {
    [].forEach.call(document.querySelectorAll('.sc'), function (el, k) { el.classList.toggle('on', k === i); });
    [].forEach.call(dots.children, function (d, k) { d.classList.toggle('on', k <= i); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function cap(t) { document.getElementById('cap').innerHTML = '<span>ANDREW</span>' + esc(t); }
  function speak(t) { return (window.RRB_SPEECH ? window.RRB_SPEECH.speak(t) : Promise.resolve()).then(function () { return new Promise(function (r) { setTimeout(r, 350); }); }); }
  function run(i, li) {
    var tok = P.tok;
    if (i >= SC.length) { P.on = false; document.getElementById('pp').textContent = 'Play'; return; }
    if (li === 0) show(i);
    var L = SC[i][1];
    if (li >= L.length) return setTimeout(function () { if (tok === P.tok && !P.paused) run(i + 1, 0); }, 600);
    var line = L[li]; P.i = i; P.li = li;
    if (line[1]) { var el = document.querySelector(line[1]); if (el) el.classList.add('show'); }
    if (i === 0 || line[1] === undefined) {}
    cap(line[0]);
    speak(line[0]).then(function () { if (tok === P.tok && !P.paused) run(i, li + 1); });
  }
  function start() {
    document.getElementById('dock').hidden = false;
    var s = document.getElementById('start'); if (s) s.remove();
    [].forEach.call(document.querySelectorAll('.card,.rec'), function (el) { el.classList.remove('show'); });
    P.tok++; P.paused = false; P.on = true; document.getElementById('pp').textContent = 'Pause'; run(0, 0);
  }
  document.getElementById('pp').onclick = function () {
    if (P.paused) { P.paused = false; P.tok++; this.textContent = 'Pause'; run(P.i, P.li); }
    else { P.paused = true; P.tok++; this.textContent = 'Play'; try { speechSynthesis.cancel(); } catch (e) {} }
  };
  document.getElementById('rp').onclick = start;
  var st = document.createElement('div'); st.className = 'start'; st.id = 'start';
  st.innerHTML = '<button type="button" class="play" aria-label="Play your family plan"><svg width="44" height="44" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></button>' +
    '<h2>' + esc(names) + ', your family plan</h2><p>Prepared for you by ' + esc(D.advisor) + '. About three minutes, narrated.</p><p class="safe">Driving? Just listen: the screen is not needed.</p>';
  document.body.appendChild(st);
  st.querySelector('.play').onclick = start;
  show(0);
})();
</script>
<script src="branch-wa.js" defer data-wa-fab-only></script>
</body>
</html>
