<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1f33">
<title>Close out your month · RR Branch</title>
<link rel="icon" href="shield.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!--
  close.html: factfind360.com/close?m=2026-10. The month close-out, opened
  from the e-mail MonthClose.gs sends on the second working day of a month.
  The advisor sees their month against their own flight plan, then rates it,
  names the win and what got in the way, and commits to next month.
  Same sign-in as the flight plan (rrbSession), same /exec as the wall.
-->
<style>
  :root{
    --ground:#0d1f33; --panel:#14314f; --panel-2:#1b4268; --line:#2a4d74;
    --ink:#F3F7FD; --ink-2:#c3d2e4; --ink-3:#9fb3cc;
    --gold:#F5B935; --teal:#2DD4BF; --good:#34D399; --warn:#FBBF24; --bad:#FB7185;
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(1200px 600px at 85% -10%,rgba(45,212,191,.12),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(245,185,53,.10),transparent 60%),var(--ground);min-height:100vh}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  header img{width:34px;height:34px}
  header b{font-size:15px} header span{color:var(--ink-3);font-size:13px}
  header .sp{flex:1}
  .btn{appearance:none;border:0;border-radius:12px;background:linear-gradient(135deg,#0E7490,#0d9488);color:#fff;font:800 16px Inter,sans-serif;padding:14px 22px;cursor:pointer;min-height:48px}
  .btn:disabled{opacity:.6}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:600;padding:8px 12px;min-height:40px;font-size:14px}
  .card{background:linear-gradient(180deg,var(--panel),#11283f);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 14px}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);font-weight:700}
  h1{font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.15;margin:6px 0 4px;font-weight:900;letter-spacing:-.02em}
  h2{font-size:1.15rem;margin:0 0 10px}
  .lede{color:var(--ink-2);margin:0}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr));gap:10px}
  .tile{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .tile small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .tile b{display:block;font-size:1.6rem;font-weight:900;letter-spacing:-.02em;margin-top:2px}
  .tile i{font-style:normal;color:var(--ink-3);font-size:13px}
  .good{color:var(--good)}
  .ring{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .ring svg{width:130px;height:130px;flex:0 0 auto}
  @media (max-width:600px){.ring{flex-direction:column;align-items:stretch}.ring svg{align-self:center}#tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:1.3rem}}
  ul.ins{margin:0;padding-left:20px} ul.ins li{margin:0 0 7px;color:var(--ink-2)}
  .hon{display:flex;flex-wrap:wrap;gap:8px}
  .hon div{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:rgba(255,255,255,.03);font-size:14px}
  .hon div.me{border-color:var(--gold);background:rgba(245,185,53,.12)}
  .hon b{color:var(--gold)}
  label.q{display:block;font-weight:700;margin:16px 0 6px}
  label.q i{font-style:normal;font-weight:400;color:var(--ink-3);font-size:14px}
  textarea,input[type=number],input[type=text],input[type=password]{width:100%;background:#0b1a2b;border:1px solid #7d8890;border-radius:12px;color:var(--ink);font:max(16px,1rem)/1.45 Inter,sans-serif;padding:12px}
  textarea{min-height:84px;resize:vertical}
  textarea:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px}
  .stars{display:flex;gap:8px}
  .stars button{flex:1;min-height:52px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink-2);font:800 15px Inter,sans-serif;cursor:pointer}
  .stars button.on{background:var(--gold);color:#0a1a2b;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:10px}
  .grid2 label{font-size:14px;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:8px 14px;font:600 14px Inter,sans-serif;cursor:pointer;min-height:40px}
  .chips button.on{background:var(--teal);color:#0a1a2b;border-color:var(--teal)}
  .hint{color:var(--ink-3);font-size:13px;margin-top:4px}
  .err{color:var(--bad);min-height:1.4em;margin-top:8px}
  .done{text-align:center;padding:30px 20px}
  .done .tick{width:84px;height:84px;margin:0 auto 10px}
  .done .tick path{stroke-dasharray:60;stroke-dashoffset:0}
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
    .card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
    .done .tick path{animation:draw .8s .2s ease-out both}
    .ring .arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="shield.svg" alt=""><div><b>Ricky Rampersad Branch</b><br><span>Month close-out</span></div><div class="sp"></div>
    <button class="btn ghost" id="outBtn" hidden>Sign out</button></header>

  <section id="vSign" class="card" hidden>
    <div class="eyebrow">Close out your month</div>
    <h1>Sign in</h1>
    <p class="lede">Your agent number and the password you use for the fact find.</p>
    <form id="signForm">
      <label class="q" for="siCode">Agent number</label><input type="text" id="siCode" autocomplete="username" autocapitalize="characters">
      <label class="q" for="siPw">Password</label><input type="password" id="siPw" autocomplete="current-password">
      <div class="err" id="siErr"></div>
      <button class="btn" id="siBtn" type="submit">Sign in</button>
    </form>
  </section>

  <section id="vLoad" class="card" hidden><p class="lede" id="loadMsg">Reading your month…</p></section>

  <div id="vMain" hidden>
    <section class="card">
      <div class="eyebrow" id="mEyebrow"></div>
      <h1 id="mHead"></h1>
      <p class="lede" id="mLede"></p>
      <div class="ring" style="margin-top:14px">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
          <circle class="arc" id="arc" cx="60" cy="60" r="50" fill="none" stroke="#2DD4BF" stroke-width="12" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
          <text x="60" y="58" text-anchor="middle" fill="#F3F7FD" font-size="24" font-weight="900" id="arcPct">0%</text>
          <text x="60" y="78" text-anchor="middle" fill="#9fb3cc" font-size="10">of your goal</text></svg>
        <div class="tiles" style="flex:1" id="tiles"></div>
      </div>
    </section>
    <section class="card"><h2>What the numbers say</h2><ul class="ins" id="ins"></ul></section>
    <section class="card" id="honCard"><h2>The branch&rsquo;s honours</h2><div class="hon" id="hon"></div></section>

    <section class="card" id="form">
      <div class="eyebrow">Your close-out</div>
      <h2 id="fHead" style="margin-top:6px"></h2>
      <label class="q">How did the month go? <i>1 hard, 5 great</i></label>
      <div class="stars" id="stars"></div>
      <label class="q" for="fWin">Your biggest win</label><textarea id="fWin" maxlength="1000"></textarea>
      <label class="q" for="fObs">What got in the way</label><textarea id="fObs" maxlength="1000"></textarea>
      <label class="q" for="fDiff">What you will do differently</label><textarea id="fDiff" maxlength="1000"></textarea>
      <label class="q" id="fNextQ"></label>
      <div class="grid2">
        <label>API (TT$)<input type="number" id="fApi" inputmode="numeric" min="0" step="1000"></label>
        <label>Applications<input type="number" id="fApps" inputmode="numeric" min="0"></label>
        <label>Fact finds<input type="number" id="fFfs" inputmode="numeric" min="0"></label>
        <label>Appointments a week<input type="number" id="fAppts" inputmode="numeric" min="0"></label>
      </div>
      <div class="hint" id="fNextHint"></div>
      <label class="q">Help you want from the branch <i>optional</i></label>
      <div class="chips" id="chips"></div>
      <textarea id="fHelp" maxlength="500" placeholder="Anything else" style="margin-top:8px;min-height:60px"></textarea>
      <div class="err" id="fErr"></div>
      <button class="btn" id="fBtn" type="button">Close out my month</button>
    </section>

    <section class="card done" id="vDone" hidden>
      <svg class="tick" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38" fill="none" stroke="#34D399" stroke-width="5"/><path d="M26 43l11 11 21-23" fill="none" stroke="#34D399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 id="dHead"></h1><p class="lede" id="dLede"></p>
      <p style="margin-top:16px"><button class="btn ghost" id="editBtn" type="button">Change my answers</button></p>
    </section>
  </div>
</div>
<script>
'use strict';
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbx776ORwmwhm2u4vx2YGQPC6bRR9gTQ-Y-Yc1up0FNGkCKGaQdet-APT1PJsrAxxJ3dsQ/exec';
var SESSION_MAX_AGE_MS = 12 * 3600e3;
var Q = new URLSearchParams(location.search), MONTH = /^\d{4}-\d{2}$/.test(Q.get('m') || '') ? Q.get('m') : '';
var S = { session: null, d: null, rating: 0, help: [] };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { n = Math.round(+n || 0); return 'TT$' + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function k(n) { n = Math.round(+n || 0); return n >= 1e6 ? 'TT$' + (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'm' : n >= 1e4 ? 'TT$' + Math.round(n / 1000) + 'k' : money(n); }
function show(id) { ['vSign', 'vLoad', 'vMain'].forEach(function (v) { $(v).hidden = v !== id; }); window.scrollTo(0, 0); }
function recall(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }
function store(key, v) { try { if (v == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
async function call(url, opts, ms) {
  var c = new AbortController(), t = setTimeout(function () { c.abort(); }, ms || 45000); opts.signal = c.signal;
  try { var r = await fetch(url, opts); var b = await r.text(); return JSON.parse(b); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'The branch server did not answer in time. Try again.' : 'Could not reach the branch server. Try again.'); }
  finally { clearTimeout(t); }
}
function readSession() { var s = recall('rrbSession'); return (s && s.token && (!s.at || Date.now() - s.at < SESSION_MAX_AGE_MS)) ? s : null; }

$('signForm').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  var code = $('siCode').value.trim().toUpperCase(), pw = $('siPw').value;
  if (!code || !pw) { $('siErr').textContent = 'Both, please.'; return; }
  $('siBtn').disabled = true; $('siBtn').textContent = 'Signing in…'; $('siErr').textContent = '';
  try {
    var j = await call(ENDPOINT + '?action=login&code=' + encodeURIComponent(code) + '&pw=' + encodeURIComponent(pw), { method: 'GET', redirect: 'follow' }, 45000);
    if (j && j.ok) {
      var s = { code: j.code || code, name: j.name || '', email: j.email || '', role: j.role || '', unit: j.unit || '', unitKey: j.unitKey || '', scope: j.scope || null, token: j.token || '', at: Date.now() };
      store('rrbSession', s); S.session = s; $('siPw').value = ''; load();
    } else $('siErr').textContent = (j && j.error) || 'That number and password did not match.';
  } catch (e) { $('siErr').textContent = e.message; }
  finally { $('siBtn').disabled = false; $('siBtn').textContent = 'Sign in'; }
});
$('outBtn').addEventListener('click', function () { store('rrbSession', null); S.session = null; $('outBtn').hidden = true; show('vSign'); });

async function load() {
  $('outBtn').hidden = false; show('vLoad');
  try {
    var j = await call(ENDPOINT + '?action=goal_close_me&token=' + encodeURIComponent(S.session.token) + (MONTH ? '&m=' + MONTH : ''), { method: 'GET', redirect: 'follow' }, 60000);
    if (j && j.expired) { store('rrbSession', null); $('siErr').textContent = 'Your sign-in has expired. Sign in again.'; show('vSign'); return; }
    if (j && j.noPlan) { $('loadMsg').innerHTML = esc(j.error) + '<br><br><a class="btn" style="display:inline-block;text-decoration:none" href="goals">File my flight plan</a>'; return; }
    if (!j || !j.ok) { $('loadMsg').textContent = (j && j.error) || 'The close-out is not open yet. Try again later today.'; return; }
    S.d = j; paint();
  } catch (e) { $('loadMsg').textContent = e.message; }
}

function paint() {
  var d = S.d, p = d.p, m = d.month, first = String(d.me.name || '').split(/\s+/)[0];
  var mine = d.honours.filter(function (h) { return h.mine; });
  $('mEyebrow').textContent = m.name + ' ' + m.y + ' · closed';
  $('mHead').textContent = mine.length ? 'Congratulations, ' + first + '. ' + mine[0].title + '.' : p.pct >= 100 ? first + ', you beat your ' + m.name + ' plan.' : first + ', here is your ' + m.name + '.';
  $('mLede').textContent = p.goal ? 'Measured against your own FY27 flight plan.' : 'You have no filed flight plan, so there is no goal to measure against.';
  var pct = p.pct || 0;
  $('arcPct').textContent = p.goal ? pct + '%' : '—';
  requestAnimationFrame(function () { $('arc').setAttribute('stroke-dashoffset', String(314.16 * (1 - Math.min(1, pct / 100)))); if (pct >= 100) $('arc').setAttribute('stroke', '#34D399'); });
  $('tiles').innerHTML = [
    ['Submitted', k(p.sub.api), p.sub.apps + ' apps', pct >= 100],
    ['Settled', k(p.set.api), p.set.apps + ' policies'],
    [m.name.slice(0, 3) + ' goal', p.goal ? k(p.goal.api) : '—', 'your flight plan'],
    ['Fact finds', p.ffs.filed, p.goal ? 'plan asks ' + Math.round(p.goal.ffs) : ''],
    ['Year to date', k(p.ytd.api), p.yearGoal ? Math.round(p.ytd.api / p.yearGoal * 100) + '% of ' + k(p.yearGoal) : ''],
    ['Place', p.rank ? p.rank + ' of ' + p.of : '—', 'on API submitted']
  ].map(function (t) { return '<div class="tile"><small>' + t[0] + '</small><b' + (t[3] ? ' class="good"' : '') + '>' + esc(t[1]) + '</b><i>' + esc(t[2]) + '</i></div>'; }).join('');
  $('ins').innerHTML = d.insights.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('');
  $('honCard').hidden = !d.honours.length;
  $('hon').innerHTML = d.honours.map(function (h) { return '<div' + (h.mine ? ' class="me"' : '') + '><b>' + esc(h.title) + '</b> · ' + esc(h.names.join(', ')) + ' · ' + esc(h.value) + (h.mine ? ' · you' : '') + '</div>'; }).join('');
  $('fHead').textContent = 'Close out ' + m.name + ' and set ' + m.next;
  $('fNextQ').innerHTML = 'Your commitment for ' + esc(m.next);
  var ng = d.nextGoal, a = d.answers || {};
  $('fNextHint').textContent = ng ? 'Your plan asks ' + money(ng.plan) + ' for ' + m.next + (ng.api > ng.plan ? '; to stay on your quarter it now needs ' + money(ng.api) + '.' : '.') : '';
  $('fApi').value = a.nextApi || (ng ? ng.api : ''); $('fApps').value = a.nextApps || (ng ? ng.apps : '');
  $('fFfs').value = a.nextFfs || (ng ? ng.ffs : ''); $('fAppts').value = a.nextAppts || (ng ? ng.apptWeek : '');
  $('fWin').value = a.win || ''; $('fObs').value = a.obstacle || ''; $('fDiff').value = a.differently || ''; $('fHelp').value = a.helpText || '';
  S.rating = +a.rating || 0; S.help = [].concat(a.help || []);
  $('stars').innerHTML = [1, 2, 3, 4, 5].map(function (n) { return '<button type="button" data-n="' + n + '" aria-pressed="' + (S.rating === n) + '"' + (S.rating === n ? ' class="on"' : '') + '>' + n + ' ★</button>'; }).join('');
  $('chips').innerHTML = d.help.map(function (h) { var on = S.help.indexOf(h) > -1; return '<button type="button" aria-pressed="' + on + '"' + (on ? ' class="on"' : '') + '>' + esc(h) + '</button>'; }).join('');
  show('vMain');
  if (d.closedAt) done(true); else { $('form').hidden = false; $('vDone').hidden = true; }
}
$('stars').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; S.rating = +b.dataset.n;
  [].forEach.call(this.children, function (x) { var on = +x.dataset.n === S.rating; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); });
$('chips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var t = b.textContent, i = S.help.indexOf(t);
  if (i > -1) S.help.splice(i, 1); else S.help.push(t); b.classList.toggle('on', i < 0); b.setAttribute('aria-pressed', i < 0); });

$('fBtn').addEventListener('click', async function () {
  var a = { rating: S.rating, win: $('fWin').value.trim(), obstacle: $('fObs').value.trim(), differently: $('fDiff').value.trim(),
            nextApi: +$('fApi').value || 0, nextApps: +$('fApps').value || 0, nextFfs: +$('fFfs').value || 0, nextAppts: +$('fAppts').value || 0,
            help: S.help, helpText: $('fHelp').value.trim() };
  if (!a.rating) { $('fErr').textContent = 'Rate the month first.'; return; }
  if (!a.win) { $('fErr').textContent = 'Name one win from the month.'; $('fWin').focus(); return; }
  if (!(a.nextApi > 0)) { $('fErr').textContent = 'Set your API commitment for ' + S.d.month.next + '.'; $('fApi').focus(); return; }
  $('fErr').textContent = ''; $('fBtn').disabled = true; $('fBtn').textContent = 'Saving…';
  try {
    var j = await call(ENDPOINT, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ stage: 'goal_close', token: S.session.token, m: S.d.month.ym, answers: a }) }, 45000);
    if (j && j.ok) { S.d.answers = a; S.d.closedAt = j.closedAt; done(false); }
    else $('fErr').textContent = (j && j.error) || 'Nothing was saved. Try again.';
  } catch (e) { $('fErr').textContent = e.message; }
  finally { $('fBtn').disabled = false; $('fBtn').textContent = 'Close out my month'; }
});
function done(already) {
  var m = S.d.month, a = S.d.answers || {};
  $('form').hidden = true; $('vDone').hidden = false;
  $('dHead').textContent = m.name + ' is closed.';
  $('dLede').textContent = (already ? 'You closed it out already. ' : 'Thank you. ') + 'Your ' + m.next + ' commitment: ' + money(a.nextApi) +
    (a.nextApps ? ', ' + a.nextApps + ' apps' : '') + (a.nextFfs ? ', ' + a.nextFfs + ' fact finds' : '') + '. The branch manager and your unit manager see it.';
  $('vDone').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('editBtn').addEventListener('click', function () { $('vDone').hidden = true; $('form').hidden = false; $('form').scrollIntoView({ behavior: 'smooth' }); });

S.session = readSession();
if (S.session) load(); else show('vSign');
</script>
</body>
</html>
