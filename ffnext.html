<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The new fact find · preview</title>
<link rel="icon" href="shield.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<!--
  The new fact find: a PREVIEW (9 November 2026).
  Asked for: "a totally redesigned look and feel to ensure that the agents are
  enjoying filling it out". The live form (ffproject.html) is untouched.

  What this page is: the same questions the live form asks, in the order a
  meeting goes, one chapter at a time. Only the questions that apply are asked;
  the money picture is worked out as the agent types; the client can be shown
  their own picture full screen; and a list of what is still missing sits in
  the corner the whole time.

  What it is not yet: it sends nothing and saves nothing to the branch. Answers
  stay on this device. Nothing here replaces the live form until the branch
  manager says so.
-->
<style>
  @font-face{font-family:'Inter Tight Fallback';src:local('Arial'),local('Helvetica'),local('Liberation Sans'),local('Arimo');size-adjust:102%;ascent-override:94%;descent-override:24%}
  @font-face{font-family:'Inter Fallback';src:local('Arial'),local('Helvetica'),local('Liberation Sans'),local('Arimo');size-adjust:107%;ascent-override:90%;descent-override:22%}
  @font-face{font-family:'Inter Fallback R';src:local('Roboto');size-adjust:103%}
  :root{
    --ground:#f4f6f5; --card:#fff; --ink:#0d3f5e; --body:#24343f; --muted:#5b6670;
    --teal:#00728d; --teal2:#0e93b0; --navy:#0b2a40; --gold:#f3c454; --gold-ink:#7a4b00;
    --good:#0f7b4f; --warn:#b45309; --line:#e2e6e3; --line-strong:#7d8890;
    --disp:'Inter Tight','Inter Tight Fallback',system-ui,sans-serif;
    --text:Inter,'Inter Fallback','Inter Fallback R',system-ui,sans-serif;
    --sh:0 1px 2px rgba(13,40,60,.06),0 10px 30px -12px rgba(13,40,60,.18);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;scroll-padding-top:180px;scroll-padding-bottom:110px}
  body{margin:0;background:var(--ground);color:var(--body);font:16px/1.5 var(--text)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ── the bar along the top ─────────────────────────────────────────── */
  .top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px 0;box-shadow:0 6px 20px -10px rgba(0,0,0,.4)}
  .top .r{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
  .top img{width:28px;height:34px;flex:none}
  .who{flex:1;min-width:0;line-height:1.2}
  .who b{display:block;font:800 16px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who small{display:block;color:#9fe3e6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saved{font-size:12px;color:#9fe3e6;white-space:nowrap}
  @media (max-width:420px){ .saved{max-width:4.5rem;overflow:hidden;text-overflow:clip} }
  .ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;flex:none}
  .ib:hover{background:rgba(255,255,255,.18)}
  .prog{max-width:1180px;margin:10px auto 0;height:5px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#14b8a6,var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .chaps{max-width:1180px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
  .chaps::-webkit-scrollbar{display:none}
  .chaps button{flex:none;border:0;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;background:rgba(255,255,255,.08);color:#c6d6e2;white-space:nowrap}
  .chaps button.fin{color:#7fe0d4}
  .chaps button.fin::before{content:"✓ "}
  .chaps button.on{background:var(--gold);color:var(--navy)}
  .chaps button.skip{opacity:.4;text-decoration:line-through}
  .pv{background:#fff7e0;color:var(--gold-ink);font-size:13px;text-align:center;padding:7px 12px;border-bottom:1px solid #f2d38a}

  /* ── layout: the chapter, and the live picture beside it ───────────── */
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 130px;display:grid;gap:22px}
  @media (min-width:1000px){ .wrap{grid-template-columns:minmax(0,1fr) 340px;padding-bottom:60px} }
  .side{display:none}
  @media (min-width:1000px){ .side{display:block;position:sticky;top:140px;align-self:start} }

  .chap{display:none}
  .chap.on{display:block}
  @media (prefers-reduced-motion:no-preference){ .chap.on{animation:in .45s cubic-bezier(.2,.8,.2,1)} }
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eb{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:800}
  h1{font:900 clamp(1.7rem,4.5vw,2.4rem)/1.08 var(--disp);color:var(--ink);letter-spacing:-.02em;margin:4px 0 6px}
  .lede{color:var(--muted);margin:0 0 16px;max-width:42rem}
  .say{background:#e7f6f4;border:1px solid #b9e6df;border-radius:14px;padding:11px 14px;color:#0e4a5e;font-size:14.5px;margin:0 0 14px}
  .say b{color:var(--teal)}
  .card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
  .card h3{font:800 1.05rem var(--disp);color:var(--ink);margin:0 0 12px}
  .q{margin:0 0 16px}
  .q:last-child{margin-bottom:0}
  .q > label,.q > .lab{display:block;font-size:14px;font-weight:700;color:#34434f;margin:0 0 6px}
  .q .hint{font-size:13px;color:var(--muted);margin-top:5px}
  .q.need > label::after,.q.need > .lab::after{content:" *";color:var(--warn)}
  .in{width:100%;min-height:52px;border-radius:13px;border:1.5px solid #cfdbe0;background:#fff;padding:12px 14px;font-size:max(16px,1rem);outline:none;transition:border-color .2s}
  .in:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,114,141,.15)}
  .in.ok{border-color:#14b8a6}
  .money{position:relative}
  .money::before{content:"TT$";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:15px;pointer-events:none}
  .money .in{padding-left:52px;font-variant-numeric:tabular-nums}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:12px}
  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{flex:1 1 auto;min-width:5.5rem;min-height:48px;border-radius:13px;border:1.5px solid #cfdbe0;background:#fff;font-weight:700;font-size:15px;padding:10px 12px}
  .seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .seg.big button{min-height:64px;text-align:left;padding:12px 14px}
  .seg.big button small{display:block;font-weight:500;font-size:13px;opacity:.8}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips button{border-radius:999px;border:1.5px solid #cfdbe0;background:#fff;padding:9px 14px;font-weight:700;font-size:14.5px}
  .chips button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  .chips button[aria-pressed="true"]::before{content:"✓ "}
  .miss{font-size:13px;color:var(--warn);margin-top:5px;display:none}
  .q.missing .miss{display:block}
  .q.missing .in{border-color:#f0b46b}
  .reveal{display:none}
  .reveal.on{display:block}
  @media (prefers-reduced-motion:no-preference){ .reveal.on{animation:in .35s ease} }
  .row-list{display:grid;gap:10px}
  .item{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:10px;position:relative}
  .item .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:9px;border:0;background:#f2f4f3;color:var(--muted)}
  .add{border:1.5px dashed #9fb7bf;background:#f8fbfb;border-radius:14px;min-height:50px;font-weight:800;color:var(--teal);width:100%}
  .slider{display:flex;align-items:center;gap:12px}
  .slider input{flex:1;accent-color:var(--teal);height:28px}
  .slider output{font:800 1.1rem var(--disp);color:var(--ink);min-width:5.5rem;text-align:right}

  /* ── the bar along the bottom ──────────────────────────────────────── */
  .foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .foot .r{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:auto 52px 1fr;gap:10px}
  @media (min-width:1000px){ .foot .r{grid-template-columns:auto 52px minmax(0,1fr) 340px} .foot .r::after{content:""} }
  .back{min-height:52px;padding:0 18px;border-radius:14px;border:1.5px solid #cfdbe0;background:#fff;font-weight:800;color:#34434f}
  .mic{min-height:52px;border-radius:14px;border:0;background:var(--teal);color:#fff;display:grid;place-items:center}
  .mic.live{background:#c2410c}
  @media (prefers-reduced-motion:no-preference){ .mic.live{animation:pulse 1.2s infinite} }
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(194,65,12,.18)}}
  .next{min-height:52px;border-radius:14px;border:0;background:var(--gold);color:var(--navy);font-weight:800;font-size:16.5px;padding:0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .next:disabled{opacity:.5}
  .pill{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:19;border:0;background:var(--navy);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -6px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center}
  .pill b{color:var(--gold)}
  .pill .n{background:#c2410c;border-radius:999px;padding:1px 7px;font-size:12px}
  @media (min-width:1000px){ .pill{display:none} }

  /* ── the live picture ──────────────────────────────────────────────── */
  .pic{background:var(--navy);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh)}
  .pic h4{margin:0;font:800 12px var(--text);letter-spacing:.14em;text-transform:uppercase;color:#9fe3e6}
  .need{font:900 2.1rem/1 var(--disp);margin:8px 0 2px;font-variant-numeric:tabular-nums}
  .need small{display:block;font:500 13px var(--text);color:#c6d6e2;margin-top:6px}
  .bars{margin:16px 0 4px;display:grid;gap:9px}
  .bar{display:grid;grid-template-columns:7.5rem 1fr auto;gap:8px;align-items:center;font-size:12.5px;color:#c6d6e2}
  .bar i{display:block;height:9px;border-radius:5px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
  .bar i span{position:absolute;inset:0 auto 0 0;border-radius:5px;background:linear-gradient(90deg,#14b8a6,#7fe0d4);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .bar.gap i span{background:linear-gradient(90deg,#f59e0b,var(--gold))}
  .bar b{color:#fff;font-variant-numeric:tabular-nums}
  .show{margin-top:14px;width:100%;min-height:48px;border:0;border-radius:13px;background:var(--gold);color:var(--navy);font-weight:800}
  .todo{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
  .todo h4{margin:0 0 8px;font:800 14px var(--disp);color:var(--ink)}
  .todo ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .todo li button{border:0;background:none;padding:0;text-align:left;color:var(--warn);font-weight:600;font-size:14px}
  .todo li button::before{content:"○ "}
  .todo .clear{color:var(--good);font-weight:700;font-size:14px}

  /* ── the client's own picture, full screen ─────────────────────────── */
  .client{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 85% 0%,#0d7d86 0%,rgba(13,125,134,0) 55%),#081d2e;color:#fff;overflow:auto;display:none;padding:22px 20px 40px}
  .client.on{display:block}
  .client .in2{max-width:960px;margin:0 auto}
  .client .cx{position:fixed;right:16px;top:16px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
  .client h2{font:900 clamp(1.9rem,6vw,3.4rem)/1.05 var(--disp);letter-spacing:-.02em;margin:28px 0 8px}
  .client h2 em{font-style:normal;color:var(--gold)}
  .client p.l{color:#c6d6e2;font-size:1.1rem;margin:0 0 26px;max-width:40rem}
  .cgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,19rem),1fr))}
  .ccard{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px}
  .ccard h3{margin:0 0 4px;font:800 13px var(--text);letter-spacing:.12em;text-transform:uppercase;color:#9fe3e6}
  .ccard .big{font:900 2.4rem/1.05 var(--disp);font-variant-numeric:tabular-nums}
  .ccard .sub{color:#c6d6e2;font-size:14px;margin-top:4px}
  .donut{width:180px;height:180px;margin:10px auto 0;display:block}
  .legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:#c6d6e2;margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
  .stack{display:grid;gap:8px;margin-top:12px}
  .stack .bar{grid-template-columns:8rem 1fr auto;color:#dbe7ee}
  .track{height:16px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:12px}
  .track span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#f59e0b,var(--gold));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
  .client .after{margin-top:16px;border-top:1px dashed rgba(255,255,255,.18);padding-top:14px}

  /* ── finishing ─────────────────────────────────────────────────────── */
  .sig{border:1.5px dashed #9fb7bf;border-radius:14px;background:#fbfdfd;height:160px;position:relative;touch-action:none}
  .sig canvas{width:100%;height:100%;display:block}
  .sig span{position:absolute;left:14px;bottom:10px;font-size:12.5px;color:var(--muted);pointer-events:none}
  .done{position:fixed;inset:0;z-index:60;background:rgba(8,29,46,.86);display:none;place-items:center;padding:20px}
  .done.on{display:grid}
  .done .box{background:#fff;border-radius:24px;padding:28px 24px;max-width:440px;text-align:center}
  .done svg{width:96px;height:96px}
  .done h2{font:900 1.8rem/1.1 var(--disp);color:var(--ink);margin:10px 0 6px}
  .done p{color:var(--muted);margin:0 0 6px}
  .done .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
  .done .stats div{background:#f4f6f5;border-radius:14px;padding:10px 6px;font-size:12px;color:var(--muted)}
  .done .stats b{display:block;font:900 1.3rem var(--disp);color:var(--ink)}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:61}
  .menu{position:absolute;right:16px;top:58px;background:#fff;color:var(--body);border-radius:14px;box-shadow:0 18px 40px -10px rgba(0,0,0,.35);padding:6px;display:none;min-width:220px;z-index:30}
  .menu.on{display:block}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-radius:10px;font-weight:600}
  .menu button:hover{background:#f2f5f4}
  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:70;max-width:90vw;text-align:center}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header class="top">
  <div class="r">
    <img src="shield.svg" alt="">
    <div class="who"><b id="tName">New client</b><small id="tStep">Fact find · step 1 of 8</small></div>
    <span class="saved" id="saved">Kept on this device</span>
    <button class="ib" id="mBtn" aria-label="More" aria-haspopup="true">⋯</button>
  </div>
  <div class="prog"><i id="prog"></i></div>
  <nav class="chaps" id="chaps" aria-label="Chapters"></nav>
  <div class="menu" id="menu" role="menu">
    <button role="menuitem" data-m="sample">Fill with a sample client</button>
    <button role="menuitem" data-m="show">Show the client their picture</button>
    <button role="menuitem" data-m="reset">Start a new fact find</button>
    <button role="menuitem" data-m="old">Open today's form instead</button>
  </div>
</header>
<div class="pv">Preview of the new fact find. Nothing here is sent to the branch; answers stay on this device.</div>

<main class="wrap">
  <div id="chapters"></div>
  <aside class="side" id="side"></aside>
</main>

<button class="pill" id="pill" type="button"><span>Need <b id="pNeed">TT$0</b></span><span class="n" id="pTodo">0</span></button>

<footer class="foot"><div class="r">
  <button class="back" id="back" type="button">Back</button>
  <button class="mic" id="mic" type="button" aria-label="Speak the answer into the box you're on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="next" id="next" type="button">Next</button>
</div></footer>

<section class="client" id="client" aria-label="The client's picture"><button class="cx" id="cx" aria-label="Close">×</button><div class="in2" id="clientBody"></div></section>
<div class="done" id="done"><div class="box" id="doneBox"></div></div>
<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ── the answers ─────────────────────────────────────────────────────── */
var KEY = 'ffnext-draft';
var A = {};
try { A = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { A = {}; }
var started = A._started || Date.now(); A._started = started;
function save() { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} var t = new Date(); $('saved').textContent = 'Saved ✓ ' + t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function $(id) { return document.getElementById(id); }
function n(v) { var x = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(x) ? x : 0; }
function money(v) { v = Math.round(v || 0); return 'TT$' + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function short(v) { v = Math.round(v || 0); var a = Math.abs(v); return a >= 1e6 ? 'TT$' + (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'm' : a >= 1e4 ? 'TT$' + Math.round(a / 1000) + 'k' : money(a); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function first(name) { return String(name || '').trim().split(/\s+/)[0] || ''; }
function ageOf(iso) { if (!iso) return 0; var d = new Date(iso); if (isNaN(d)) return 0; var t = new Date(), a = t.getFullYear() - d.getFullYear(); if (t < new Date(t.getFullYear(), d.getMonth(), d.getDate())) a--; return a; }

/* ── the chapters, in the order a meeting goes ──────────────────────── */
/* Each question: k (the answer's key), t (type), l (label), need (true or a
   function), show (a function: ask only when it applies), and words. */
var YN = ['Yes', 'No'];
var CH = [
  { id: 'start', name: 'Start', title: 'Who are we meeting?', why: 'Two choices that shape everything after, and how to reach them.', mins: 1,
    say: 'Before we start: you can tell us everything (full disclosure), or just the one thing you came for.',
    cards: [
      { qs: [
        { k: 'choice', t: 'big', l: "The client's choice", need: true, o: [['Full disclosure', 'We look at the whole picture'], ['Specific need only', 'Just the one product or need']] },
        { k: 'kind', t: 'seg', l: 'Is this for an individual or a family?', need: true, o: ['Individual', 'Family / joint'] },
        { k: 'need1', t: 'text', l: 'The specific need or product', show: function () { return A.choice === 'Specific need only'; }, need: true },
        { k: 'name', t: 'text', l: "Client's full name", need: true, ac: 'name' },
        { k: 'phone', t: 'tel', l: 'Contact number', need: true, ac: 'tel' },
        { k: 'email', t: 'email', l: 'E-mail address', need: true, ac: 'email', hint: 'Their draft goes here for them to confirm.' }
      ] }
    ] },
  { id: 'you', name: 'About them', title: 'About {first}', why: 'Who they are and what they earn. Income drives most of the picture.', mins: 3,
    cards: [

  else A[k] = v;
  if (k === 'marital' && (v === 'Married' || v === 'Common-law') && A.spouse == null) A.spouse = 'Yes';
  if (k === 'name') { /* carry the surname to the spouse when one is added */ }

  var q = document.querySelector('[data-q="' + k + '"]'); if (q && !blank(v)) q.classList.remove('missing');
}
document.addEventListener('click', function (ev) {
  var t = ev.target.closest('button'); if (!t) { if (!ev.target.closest('.menu,#mBtn')) $('menu').classList.remove('on'); return; }
  if (t.dataset.k && t.dataset.v != null && t.closest('.seg')) {
    t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === t ? 'true' : 'false'); });
    set(t.dataset.k, t.dataset.v); return;

    var arr = (A[t.dataset.chip] || []).slice(), i = arr.indexOf(t.dataset.v);
    if (i > -1) arr.splice(i, 1); else arr.push(t.dataset.v);

  }

    var L = A[t.dataset.addto] || (A[t.dataset.addto] = []);
    var seed = {};
    if (t.dataset.addto === 'kidsList') seed = {};
    L.push(seed); save(); redrawList(t.dataset.addto, true); return;
  }
  if (t.dataset.del) { A[t.dataset.del].splice(+t.dataset.i, 1); save(); redrawList(t.dataset.del); chrome(); return; }
  if (t.dataset.go != null) { go(+t.dataset.go); return; }
  if (t.dataset.jump) { var p = t.dataset.jump.split('|'); go(+p[0]); setTimeout(function () { var q = document.querySelector('[data-q="' + p[1] + '"]'); if (q) { q.classList.add('missing'); q.scrollIntoView({ block: 'center', behavior: 'smooth' }); var f = q.querySelector('input,textarea,select,button'); if (f) f.focus({ preventScroll: true }); } }, 120); return; }
  if (t.dataset.m) { $('menu').classList.remove('on'); menu(t.dataset.m); return; }

function redrawList(name, focusLast) {

  var el = document.querySelector('[data-list="' + name + '"]'); if (!c || !el) return;
  el.outerHTML = listHtml(c);
  if (focusLast) { var items = document.querySelectorAll('[data-list="' + name + '"] .item'); var last = items[items.length - 1]; if (last) { var f = last.querySelector('input,select'); if (f) f.focus(); } }
}
document.addEventListener('input', function (ev) {
  var el = ev.target; if (!el.dataset || !el.dataset.k) return;
  var v = el.value;
  if (el.closest('.money')) {
    var raw = v.replace(/[^0-9.]/g, ''), pos = el.selectionStart, before = v.length;
    el.value = raw ? Number(raw).toLocaleString('en-US') + (raw.slice(-1) === '.' ? '.' : '') : '';
    try { var d = el.value.length - before; el.setSelectionRange(pos + d, pos + d); } catch (e) {}
    v = raw ? n(raw) : '';
  }
  if (el.type === 'range') { var o = el.parentNode.querySelector('output'), q = findQ(el.dataset.k); if (o) o.textContent = el.value + (q && q.unit || ''); v = n(el.value); }
  el.classList.toggle('ok', v !== '' && !el.closest('.money'));
  set(el.dataset.k, v, el.dataset.row);
});
document.addEventListener('change', function (ev) { var el = ev.target; if (el.tagName === 'SELECT' && el.dataset.k) set(el.dataset.k, el.value, el.dataset.row); });
function findQ(k) { var f = null; CH.forEach(function (c) { c.cards.forEach(function (card) { (card.qs || []).forEach(function (q) { if (q.k === k) f = q; }); }); }); return f; }
/* Enter moves to the next box rather than doing anything else. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
  ev.preventDefault();
  var all = [].slice.call(document.querySelectorAll('.chap input,.chap select,.chap textarea')).filter(function (x) { return x.offsetParent; });
  var i = all.indexOf(ev.target); if (all[i + 1]) all[i + 1].focus(); else $('next').focus();
});

/* ── moving between chapters ─────────────────────────────────────────── */
function go(i) { cur = Math.max(0, Math.min(CH.length - 1, i)); A._at = cur; save(); drawChapter(); }
$('back').addEventListener('click', function () { go(nextChapter(-1)); });
$('next').addEventListener('click', function () {
  if (cur === CH.length - 1) return finish();
  var M = missing(cur);
  if (M.length) {
    M.forEach(function (m) { var q = document.querySelector('[data-q="' + m.k + '"]'); if (q) q.classList.add('missing'); });
    toast(M.length + ' still needed here. Carry on and come back, or fill them now.');
  }
  go(nextChapter(1));
});

/* ── the client's own picture ────────────────────────────────────────── */

      '<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="' + cov + '% already covered"><circle cx="90" cy="90" r="70" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="22"/>' +
      '<circle cx="90" cy="90" r="70" fill="none" stroke="#14b8a6" stroke-width="22" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '" data-to="' + (C * (1 - cov / 100)) + '" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/>' +
      '<text x="90" y="88" text-anchor="middle" fill="#fff" style="font:900 30px Inter Tight,sans-serif">' + cov + '%</text><text x="90" y="110" text-anchor="middle" fill="#c6d6e2" style="font:600 12px Inter,sans-serif">covered today</text></svg>' +
      '<div class="legend"><span><i style="background:#14b8a6"></i>Covered ' + short(P.have) + '</span><span><i style="background:#f3c454"></i>Gap ' + short(P.gap) + '</span></div></div>' +
    '<div class="ccard"><h3>What the need is made of</h3><div class="stack">' + [['Debts to clear', P.debt], ['Income for the family', P.incRep], ['Education', P.edu], ['Final expenses', P.last]].filter(function (b) { return b[1] > 0; }).map(function (b) {
      return '<div class="bar"><span>' + b[0] + '</span><i><span data-w="' + (P.need ? b[1] / P.need * 100 : 0) + '" style="width:0"></span></i><b>' + short(b[1]) + '</b></div>'; }).join('') + '</div>' +

    (P.ret ? '<div class="ccard"><h3>Retirement at ' + n(A.retAge || 60) + '</h3><div class="big">' + P.ret.pct + '%</div><div class="sub">of the retirement you want is on track today</div><div class="track"><span data-w="' + P.ret.pct + '"></span></div>' +
      '<div class="sub" style="margin-top:10px">About ' + short(P.ret.short) + ' short in ' + P.ret.yrs + ' years, at 4% inflation and a 4.5% return. An illustration, not a promise.</div></div>' : '') +
    '<div class="ccard"><h3>Each month</h3><div class="big">' + money(P.surplus) + '</div><div class="sub">left after your expenses' + (P.budget ? ', and you said ' + money(P.budget) + ' is comfortable to put aside' : '') + '</div></div>' +
    '</div>';
  $('clientBody').innerHTML = h; $('client').classList.add('on'); $('cx').focus();
  requestAnimationFrame(function () { requestAnimationFrame(function () {
    document.querySelectorAll('#clientBody [data-to]').forEach(function (c) { c.setAttribute('stroke-dashoffset', c.dataset.to); });
    document.querySelectorAll('#clientBody [data-w]').forEach(function (s) { s.style.width = s.dataset.w + '%'; });
  }); });
}
$('cx').addEventListener('click', function () { $('client').classList.remove('on'); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('client').classList.remove('on'); });

/* ── the menu ────────────────────────────────────────────────────────── */

  if (m === 'show') return showClient();
  if (m === 'old') { location.href = 'ffproject.html'; return; }
  if (m === 'reset') { if (!confirm('Start a new fact find? This one is cleared from this device.')) return; A = { _started: Date.now() }; save(); go(0); return; }
  if (m === 'sample') { A = sample(); save(); go(0); toast('A made-up client is filled in. Walk through the steps.'); }
}

  return { _started: Date.now() - 11 * 60000, choice: 'Full disclosure', kind: 'Family / joint', name: 'Jordan Mitchell', phone: '868 555 0142', email: 'jordan@example.com',
    dob: '1987-05-12', marital: 'Married', address: 'Chaguanas', emp: 'Full-time', occ: 'Teacher', employer: 'Ministry of Education', tenure: '9 years', income: 14000, biz: 'No',
    spouse: 'Yes', sName: 'Alicia Mitchell', sWorks: 'Yes', sIncome: 9000, kids: 'Yes', kidsList: [{ name: 'Maya', age: 8, fees: 1200 }, { name: 'Leo', age: 4, fees: 0 }],

}

/* ── speaking an answer ──────────────────────────────────────────────── */
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, target = null;
  document.addEventListener('focusin', function (e) { if (e.target.matches('.chap input:not([type=range]):not([type=date]),.chap textarea')) target = e.target; });
  $('mic').addEventListener('click', function () {
    if (!SR) { toast("This browser can't listen. Chrome on Android or a laptop can."); return; }
    if (rec) { rec.stop(); return; }

    rec = new SR(); rec.lang = 'en-TT'; rec.interimResults = false;

/* ── signatures ──────────────────────────────────────────────────────── */

function confetti() {
