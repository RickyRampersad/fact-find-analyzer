# factfind360.com
#
# There is no build step. The site is the files in this directory, served
# exactly as they are, so the publish directory is the repository root.
# Netlify serves ffproject.html at /ffproject and walkthrough.html at
# /walkthrough; those clean URLs are what advisors have, so do not rename
# the files.

[build]
  publish = "."
  command = ""

# The fact find and the manager dashboard carry client names, dates of
# birth, incomes, existing policy details and the recommendations made
# against them. no-store keeps that out of shared-device browser caches;
# no-referrer stops anything the page links out to from receiving the URL.
# ─────────────────────────────────────────────────────────────────────────────
# apps-script/ IS NOT PART OF THE SITE.
#
# The publish directory is the repository root, so every file in the repo is
# also a URL. That included apps-script/, which holds installation notes for
# the Google Apps Script side — and one of those notes carried a worked
# example of rrbLetterCheck's output using REAL CLIENT NAMES and their cover
# figures. It was readable by anybody at
# factfind360.com/apps-script/INSTALL-client-letter.md
#
# The names are gone from the files now. This makes sure the directory is not
# served regardless of what ends up in it later, because the next person to
# drop a note in there should not have to remember that the folder is public.
# ─────────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/apps-script/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/ffproject.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/insights.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The wall was left out of the two blocks above, and it is the page most likely
# to be read on a device nobody owns. It carries client names, every advisor's
# production and the branch roster; it runs on a screen in the office; and a
# visitor pass now opens it to any email address that asks for a code. Without
# no-store, what was last on that screen sits in the cache for whoever opens
# the browser next.
[[headers]]
  for = "/wall.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The client's own signing page: the plan, the sums assured, the premiums and
# the box they draw their signature in. It opens from a link in their email, so
# it is read on phones and family tablets more than anywhere else on the site.
# Same class of content as the fact find, and it was missing the same header.
[[headers]]
  for = "/confirm.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# wall-audio/ IS NOT PART OF THE SITE EITHER.
#
# The narration is built there and embedded into wall.html as a data URI, so
# the loose MP3s are build output, not something the site needs to serve.
# They read out advisor names and production figures, which is the same class
# of thing as the apps-script note above.
[[redirects]]
  from = "/wall-audio/*"
  to = "/index.html"
  status = 404
  force = true

# The September enhancements film. Same treatment as the pages above: it names
# the branch's own audit figures — how many policies carry a dispatch date, how
# many fact finds went back and never returned — which is for the team, not for
# a shared browser's cache.
[[headers]]
  for = "/360enhancements.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/360enhancements-film.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# 360enhancements-audio/ IS NOT PART OF THE SITE, for the same reason
# wall-audio/ is not: the narration is embedded in the film as data URIs, so
# the loose MP3s are build output. They read those same figures aloud.
[[redirects]]
  from = "/360enhancements-audio/*"
  to = "/index.html"
  status = 404
  force = true

# ─────────────────────────────────────────────────────────────────────────────
# THE SAME RULES AGAIN, ON THE URLS PEOPLE ACTUALLY OPEN.
#
# Netlify matches a [[headers]] block against the REQUEST path, and it serves
# ffproject.html at /ffproject. Advisors have the clean URL; nobody types the
# extension. So every no-store block above has been matching a path almost
# nobody requests:
#
#   /ffproject       cache-control: public,max-age=0,must-revalidate
#   /ffproject.html  cache-control: no-store
#
# must-revalidate stops a stale copy being shown, but the body is still written
# to the disk cache and still comes back on the back button after someone signs
# out. That is exactly the shared-device case the blocks above were written for
# — the fact find's names, dates of birth and incomes; the wall's client list,
# advisor production and roster, on an office screen a visitor pass can open;
# the signing page's sums assured and premiums. The rules were right and were
# aimed one character wide.
# ─────────────────────────────────────────────────────────────────────────────

[[headers]]
  for = "/ffproject"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/insights"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/wall"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/confirm"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/360enhancements"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/360enhancements-film"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

# The short cut's narration is build output too, for the same reason.
[[redirects]]
  from = "/360enhancements-audio-short/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/360enhancements-short.html"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
